name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-bookworm  # pin the OS: a glibc change breaks text indexes
        env:
          POSTGRES_USER: butine
          POSTGRES_PASSWORD: butine
          POSTGRES_DB: butine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U butine"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://butine:butine@localhost:5432/butine_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: stable
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.1"
      - name: OpenAPI schema matches the backend
        run: |
          (cd ../backend && uv run --locked python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2))") > openapi.json
          git diff --exit-code openapi.json
      - run: flutter pub get
      - name: Generated client matches the schema
        run: dart run swagger_parser --check
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: butine
          POSTGRES_PASSWORD: butine
          POSTGRES_DB: butine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U butine"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://butine:butine@localhost:5432/butine_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

name: butine
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  swagger_parser: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../design/logo/exports/app/butine-symbole-app-icon-1024.png
  adaptive_icon_foreground: ../design/logo/exports/app/android-foreground-1024.png
  adaptive_icon_background: ../design/logo/exports/app/android-background-1024.png
  adaptive_icon_monochrome: ../design/logo/exports/app/android-monochrome-1024.png
  # the exports already include the adaptive-icon safe-zone padding
  adaptive_icon_foreground_inset: 0

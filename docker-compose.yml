services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: butine
      POSTGRES_PASSWORD: butine
      POSTGRES_DB: butine
    ports:
      - "127.0.0.1:5432:5432"  # host-only: tests run from the host, not reachable from the LAN
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "butine"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://butine:butine@db:5432/butine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/sources.yaml:/app/sources.yaml:ro  # edit the catalog without rebuilding
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://butine:butine@db:5432/butine
    depends_on:
      - api  # api applies the migrations; until then the worker logs and retries
    restart: unless-stopped

volumes:
  db-data:

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: butine
      POSTGRES_PASSWORD: butine
      POSTGRES_DB: butine
    ports:
      - "5432:5432"  # exposed so tests can run from the host
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "butine"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://butine:butine@db:5432/butine
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
